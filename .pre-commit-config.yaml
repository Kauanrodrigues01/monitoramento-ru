repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format app/
        language: system
        types: [python]
        files: ^app/
        pass_filenames: true

      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check app/ --fix
        language: system
        types: [python]
        files: ^app/
        pass_filenames: true

      - id: bandit
        name: bandit
        entry: uv run bandit -r app -x app/core/seed_dev.py,app/tests
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true