global:
  scrape_interval: 15s

scrape_configs:
  - job_name: monitoramento-ru-api
    metrics_path: /metrics

    static_configs:
      - targets:
          - api:8000

  - job_name: node_exporter
    static_configs:
      - targets:
          - host.docker.internal:9100

  - job_name: "postgres_exporter"
    static_configs:
      - targets:
          - "postgres-exporter:9187"