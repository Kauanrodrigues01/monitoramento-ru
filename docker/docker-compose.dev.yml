name: monitoramento-ru-dev

services:
  api:
    container_name: monitoramento-ru-api-dev
    image: monitoramento-ru-api:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      LOG_ENV: development
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: '["*"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started

  db:
    container_name: monitoramento-ru-db-dev
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${DB_NAME:-mydb}"
      TEST_DB_NAME: "${TEST_DB_NAME:-test_db}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts:/docker-entrypoint-initdb.d:ro

  redis:
    container_name: monitoramento-ru-redis-dev
    image: redis:8.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
