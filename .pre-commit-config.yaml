repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format app/
        language: system
        types: [python]
        files: ^app/
        pass_filenames: true

      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check app/ --fix
        language: system
        types: [python]
        files: ^app/
        pass_filenames: true

      - id: bandit
        name: bandit
        entry: uv run bandit -r app -x app/core/seed_dev.py,app/tests
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        # Apenas testes unitários, para evitar que falhas em testes de integração (que dependem de serviços externos) bloqueiem o commit. Testes de integração podem ser executados manualmente ou em pipelines CI.
        entry: uv run pytest app/tests/unit --disable-warnings -q
        language: system
        pass_filenames: false
        always_run: true