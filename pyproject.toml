[project]
name = "back-end-fast-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.136.3",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    # A versão 8.0.0 do redis-py apresenta um problema no Pub/Sub assíncrono:
    # mensagens PUSH do protocolo RESP3 podem gerar a sequência
    # CancelledError -> TimeoutError dentro de pubsub.listen(),
    # fazendo com que o listener seja encerrado inesperadamente e entre
    # em ciclos de reconexão.
    #
    # Mantido em 7.4.0 temporariamente até que a correção seja lançada
    # oficialmente pelos mantenedores da biblioteca.
    "redis==7.4.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]
