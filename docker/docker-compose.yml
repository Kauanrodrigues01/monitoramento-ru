name: monitor-ru

services:
  api:
    container_name: monitor-ru-api
    image: monitor-ru-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_NAME: "${DB_NAME:-mydb}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_ENV: "${LOG_ENV:-production}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      APP_GEO_SECRET: "${APP_GEO_SECRET}"
      GEO_SIGNATURE_MAX_SKEW_SECONDS: "${GEO_SIGNATURE_MAX_SKEW_SECONDS:-60}"
      REDIS_URL: redis://redis:6379/0
      DEBUG: "${DEBUG:-False}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      CELERY_BROKER_URL: "amqp://${RABBITMQ_DEFAULT_USER:-admin}:${RABBITMQ_DEFAULT_PASS:-admin}@rabbitmq:5672/"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  
  celery-worker:
    container_name: monitor-ru-celery-worker
    image: monitor-ru-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_NAME: "${DB_NAME:-mydb}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_ENV: "${LOG_ENV:-production}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      APP_GEO_SECRET: "${APP_GEO_SECRET}"
      GEO_SIGNATURE_MAX_SKEW_SECONDS: "${GEO_SIGNATURE_MAX_SKEW_SECONDS:-60}"
      REDIS_URL: redis://redis:6379/0
      DEBUG: "${DEBUG:-False}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      CELERY_BROKER_URL: "amqp://${RABBITMQ_DEFAULT_USER:-admin}:${RABBITMQ_DEFAULT_PASS:-admin}@rabbitmq:5672/"
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: celery -A app.core.celery:celery_app worker -l INFO

  db:
    container_name: monitor-ru-db
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${DB_NAME:-mydb}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mydb}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: monitor-ru-redis
    image: redis:8.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - redis-cli ping || exit 1
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 5s

  rabbitmq:
    container_name: monitor-ru-rabbitmq
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-admin}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres-exporter:
    container_name: monitor-ru-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.18.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-mydb}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: monitor-ru-node-exporter
    restart: unless-stopped

    network_mode: host
    pid: host

    command:
      - '--path.rootfs=/host'

    volumes:
      - '/:/host:ro,rslave'

    read_only: true

    security_opt:
      - no-new-privileges:true

  prometheus:
    container_name: monitor-ru-prometheus
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    container_name: monitor-ru-grafana
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
