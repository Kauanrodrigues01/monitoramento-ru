name: monitoramento-ru

services:
  api:
    container_name: monitoramento-ru-api
    image: monitoramento-ru-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_NAME: "${DB_NAME:-mydb}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_ENV: "${LOG_ENV:-production}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      APP_GEO_SECRET: "${APP_GEO_SECRET}"
      GEO_SIGNATURE_MAX_SKEW_SECONDS: "${GEO_SIGNATURE_MAX_SKEW_SECONDS:-60}"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  db:
    container_name: monitoramento-ru-db
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${DB_NAME:-mydb}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: monitoramento-ru-redis
    image: redis:8.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data2:/data
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - redis-cli ping || exit 1
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  redis_data2:
